name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FREE_ONLY: "true"
      ALLOW_PAID_PROVIDERS: "false"
      ALLOW_EXTERNAL_WRITES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests (lake integration skips without the shared adapter)
        run: python -m pytest -q -rs
      - run: python -m compileall -q src
      - run: python -m book_flight.ingest --help
      - run: book-flight-data --help
