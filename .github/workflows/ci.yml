# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous standalone CI workflow (Ruff + pytest + CLI smoke checks), which this duplicates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.12" # matches the previous CI
      # The [lake] extra installs the pinned solo-empire-data-lake runtime so the Bronze/Silver lake
      # tests run instead of skipping.
      install-command: uv pip install -e ".[lake]" "pytest==9.1.1"
      # Same checks as the previous CI: lake runtime importable, offline tests (-rs keeps skips
      # visible), byte-compile, CLI entry points. The guard variables the previous CI set keep
      # paid providers and external writes off.
      test-command: >-
        export FREE_ONLY=true ALLOW_PAID_PROVIDERS=false ALLOW_EXTERNAL_WRITES=false &&
        python -c "import data_lake.product_adapter, data_lake.silver" &&
        python -m pytest -q -rs &&
        python -m compileall -q src &&
        python -m book_flight.ingest --help &&
        book-flight-data --help

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
