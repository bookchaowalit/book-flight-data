[project]
name = "book-flight-data"
version = "0.1.0"
description = "Flight price data ingestion and CLI."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Shared lake-first runtime (landing, Bronze Parquet, Silver, DuckDB reads).
# Pinned to an exact commit so CI runs the lake tests reproducibly.
lake = [
  "duckdb>=1.1.0,<2.0.0",
  "pyarrow>=14.0.0,<24.0.0",
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/solo-empire-data-lake/archive/68fb5a958d88eca4b8b27066a10b06b3e8a69e10.tar.gz",
]

[project.scripts]
book-flight-data = "book_flight.ingest:_cli_main"
book-flight-data-api = "book_flight.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# Pin the classic default rule set explicitly so newer ruff releases (0.16+
# widened the defaults) do not change what CI enforces.
select = ["E4", "E7", "E9", "F"]
