[project]
name = "book-flight-data"
version = "0.1.0"
description = "Flight price data ingestion and CLI."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "python-dotenv>=1.0"]

[project.scripts]
book-flight-data = "book_flight.ingest:_cli_main"
book-flight-data-api = "book_flight.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
